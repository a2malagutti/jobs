
        <!DOCTYPE html>
        <html>
        <head>
            <meta charset="UTF-8">
            <title>Hierarchical Report</title>
            <style>
                body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f7f6; padding: 40px; }
                .report-card { background: #fff; padding: 25px; border-radius: 10px; shadow: 0 4px 6px rgba(0,0,0,0.1); }
                h1 { color: #2c3e50; text-align: center; border-bottom: 2px solid #3498db; }
                .cont-h { background: #2c3e50; color: #fff; padding: 10px; margin-top: 30px; border-radius: 4px; }
                .coun-h { margin-left: 20px; color: #2980b9; border-left: 4px solid #2980b9; padding-left: 10px; font-size: 1.2em; }
                .reg-h { margin-left: 40px; color: #16a085; font-style: normal; font-weight: bold;}
                .stat-h { margin-left: 60px; color: #d35400; font-weight: bold; }
                table { width: 90%; margin: 10px 0 20px 80px; border-collapse: collapse; }
                th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
                th { background-color: #f2f2f2; }
                tr:nth-child(even) { background-color: #f9f9f9; }
                /* No bloco <style> do seu template */
                .logo-img {
                    max-width: 40px;
                    max-height: 40px;
                    border-radius: 4px;
                    object-fit: contain;
                }   
                .col-company1 { width: 15%; text-align: center; }  
                .col-id { width: 4%; text-align: center; }  
                .col-logo { width: 6%; text-align: center; }  
                .col-company2 { width: 25%; text-align: center; }  
                .col-title { width: 35%; text-align: center; }  
                .col-url { width: 10%; text-align: center; }  

                /* Adicione no bloco <style> */
                details {
                    background-color: #fff;
                    margin: 10px 0 10px 40px; /* Alinhado com a margem da região */
                    border: 1px solid #ddd;
                    border-radius: 5px;
                    overflow: hidden;
                }

                summary {
                    background-color: #7f8c8d; /* Cor da sua .reg-h */
                    color: white;
                    padding: 10px;
                    font-weight: bold;
                    cursor: pointer;
                    list-style: none; /* Remove a setinha padrão em alguns browsers */
                }

                summary:hover {
                    background-color: #95a5a6;
                }

                /* Setinha personalizada antes do título */
                summary::before {
                    content: "▶ ";
                    display: inline-block;
                    transition: transform 0.2s;
                }

                details[open] summary::before {
                    transform: rotate(90deg);
                }           

                @media print {
                    details {
                        display: block !important;
                    }
                    details > summary {
                        display: none !important; /* Esconde o cabeçalho da sanfona na impressão */
                    }
                    details[open=false] {
                        display: block !important;
                    }
                    /* Força a abertura visual no motor de renderização do PDF */
                    details:not([open]) > * {
                        display: block !important;
                    }
                }                     
            </style>
        </head>
        <body>
            
            <div class="report-card">
                <h1>Work Mode Distribution Report</h1>

                
                    <div class="cont-h">Work Mode: Remote</div>
                    
                    
                        <div class="coun-h">Platform: </div>
                        
                        <!-- Loop de Região (Aqui criamos a sanfona) -->
                        
                            <details open>
                                <summary>Category: Advanced > Specialist (1 vagas)</summary>
                                
                                <div style="padding: 10px;">
                                    <!-- AQUI AS VAGAS SÃO AGRUPADAS POR ESTADO DENTRO DA REGIÃO -->
                                    
                                        <div class="stat-h">Industry: -</div>
                                        
                                        <table>
                                            <thead>
                                                <tr>
                                                    <th class="col-id">Id</th>
                                                    <th class="col-company2">Company</th>
                                                    <th class="col-logo">Logo</th>
                                                    <th class="col-title">Job Title</th>
                                                    <th class="col-url">Link</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <!-- Loop das vagas (linhas da tabela) -->
                                                
                                                <tr>
                                                    <td style="text-align: center;">1</td>
                                                    
                                                    <td style="text-align: center;">Hire Feed</td>
                                                    <td style="text-align: center;">
                                                        
                                                            <img src="https://media.licdn.com/dms/image/v2/D4D0BAQEeII6H9qdObQ/company-logo_100_100/B4DZ3OfC9fHwAQ-/0/1777285738853/hirefeedd_logo?e=1785369600&v=beta&t=34uZU3jADxndWBebmiwAy4ZVcBfkN4Zh-MV5ZeMsB70" class="logo-img">
                                                        
                                                    </td>
                                                    <td><strong>Computer Science Specialist (remote)</strong><br><small>Hire Feed</small></td>
                                                    <td style="text-align: center;">
                                                        <a href="https://www.linkedin.com/jobs/view/4440398525/" target="_blank"> <img src="https://img.icons8.com/?size=96&id=13450&format=png" class="logo-img"></a>
                                                    </td>
                                                </tr>
                                                
                                            </tbody>
                                        </table>
                                    
                                </div>
                            </details>
                        
                    
                                
                            
                                        
            </div>
        </body>
        </html>
